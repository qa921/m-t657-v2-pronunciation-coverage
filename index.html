<!doctype html><html><head><meta charset="utf-8"><title>Harbor Language · M-T657-V2</title></head><body><main><h1>Harbor Language</h1><p id="status">Loading lesson…</p><button id="play">Play pronunciation</button></main><script>Promise.all([fetch('/data/curriculum.json').then(r=>r.json()),fetch('/data/stale-audio-manifest.json').then(r=>r.json())]).then(([c,m])=>{const p=c.prompts[0];document.querySelector('#status').textContent=p.language+' · '+p.text;document.querySelector('#play').onclick=()=>{const a=new Audio(m.entries[p.spokenTextKey]);a.play().catch(()=>document.querySelector('#status').textContent='Playback failed.');};}).catch(()=>document.querySelector('#status').textContent='Playback failed.');</script></body></html>
